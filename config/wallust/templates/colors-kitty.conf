# Chrome is pinned to the Tokyo-tech palette so the terminal matches the
# desktop. color0..15 below are deliberately left to wallust: forcing the ANSI
# ramp to a single hue makes ls, git diff and syntax highlighting unreadable.
foreground         #E6EAF0
background         #08090B
cursor             #80DDFA

active_tab_foreground     #08090B
active_tab_background     #80DDFA
inactive_tab_foreground   #6B7280
inactive_tab_background   #08090B

active_border_color   #80DDFA
inactive_border_color #1C2027
bell_border_color     #FF4D5A

