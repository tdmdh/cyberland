# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/00-Default.conf

# Orbitron/Inter can't be used here: kitty only accepts monospaced faces and
# silently falls back to Noto Sans Mono. CaskaydiaCove is the closest true
# mono to the launcher's geometry. Previous: font_family JetBrains Mono
font_family CaskaydiaCove Nerd Font
font_size 10.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell yes

window_padding_width 16
# selection_foreground none
# selection_background none
# foreground #dddddd
# background #000000
# cursor #dddddd

# BEGIN_KITTY_THEME
# Black Metal
# Disabled: this loads after 00-Default.conf -> 01-Wallust.conf and overrode the
# wallust colours. Re-enable (or run `kitty +kitten themes`) to go back to a static theme.
# include current-theme.conf
# END_KITTY_THEME
shell zsh --login
